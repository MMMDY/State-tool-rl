# Qwen3-4B policy inference profiles for the SGLang Chat Completions evaluator.
# Select with --enable-thinking (default) or --no-enable-thinking.
model: qwen3-4b
profiles:
  thinking:
    enable_thinking: true
    # Thinking must have enough room to emit both reasoning and its action.
    max_new_tokens: 2048
    repair_max_new_tokens: 2048
    sampling:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      min_p: 0.0
  non_thinking:
    enable_thinking: false
    max_new_tokens: 1200
    repair_max_new_tokens: 1200
    sampling:
      temperature: 0.7
      top_p: 0.8
      top_k: 20
      min_p: 0.0
